[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
# Solo para que BindVector.t.sol escriba el fixture del digest que cruza Solidity <-> TypeScript.
fs_permissions = [{ access = "write", path = "./test/fixtures" }]
remappings = [
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin-contracts-upgradeable/=src/flap/oz-shims/",
]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
